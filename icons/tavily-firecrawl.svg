<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Tavily Search + Firecrawl Fetch">
  <!-- Tavily search (lens over a page) feeding a Firecrawl fetch (flame) on one canvas. -->
  <defs>
    <linearGradient id="tavily-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B7285" />
      <stop offset="1" stop-color="#12435A" />
    </linearGradient>
    <linearGradient id="tavily-flame" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFB86B" />
      <stop offset="1" stop-color="#F76707" />
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="88" height="88" rx="22" fill="url(#tavily-bg)" />
  <!-- Search: a document with a magnifier over its corner. -->
  <rect x="20" y="22" width="34" height="42" rx="6" fill="#FFFFFF" opacity="0.94" />
  <path d="M27 33h20M27 41h20M27 49h13" stroke="#0B7285" stroke-width="3.4" stroke-linecap="round" />
  <circle cx="50" cy="54" r="12" fill="#FFFFFF" opacity="0.96" />
  <circle cx="50" cy="54" r="7" fill="none" stroke="#0B7285" stroke-width="3.4" />
  <path d="M55.2 59.2 60.5 64.5" stroke="#0B7285" stroke-width="3.8" stroke-linecap="round" />
  <!-- Fetch: a flame on the right, the retrieved content. -->
  <path d="M72 30c6 7 9 12 9 18a9 9 0 0 1-18 0c0-3 1.4-6 4.2-9.4-.4 3.6.7 5.6 2.4 6.4 1-4.8.4-9.2 2.4-15z" fill="url(#tavily-flame)" />
  <path d="M66 74h14M66 68h14" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" opacity="0.75" />
</svg>
