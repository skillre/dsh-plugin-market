<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Agnes Studio">
  <!-- Agnes Studio: a picture frame holding a spark, over a film-strip notch.
       The two shapes state the plugin's two capabilities (images and video)
       without relying on lettering that would break at icon size. -->
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect x="5" y="5" width="86" height="86" rx="22" fill="url(#frame)"/>
  <!-- Frame outline -->
  <rect x="20" y="24" width="56" height="42" rx="7" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.95"/>
  <!-- Horizon and a peak inside the frame: the "image" half -->
  <path d="M26 58 L40 43 L50 54 L58 46 L70 58" fill="none" stroke="#ffffff" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.95"/>
  <!-- Sun -->
  <circle cx="60" cy="36" r="5" fill="#ffffff" fill-opacity="0.95"/>
  <!-- Film perforations under the frame: the "video" half -->
  <rect x="26" y="72" width="8" height="7" rx="2" fill="#ffffff" fill-opacity="0.85"/>
  <rect x="44" y="72" width="8" height="7" rx="2" fill="#ffffff" fill-opacity="0.85"/>
  <rect x="62" y="72" width="8" height="7" rx="2" fill="#ffffff" fill-opacity="0.85"/>
</svg>
